name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-version:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/v}
          echo "tag_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $VERSION"

      - name: Check Android versionName in androidApp/build.gradle.kts
        run: |
          GRADLE_VERSION=$(grep 'versionName' androidApp/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          TAG_VERSION=${{ steps.tag_version.outputs.tag_version }}
          echo "Gradle versionName: $GRADLE_VERSION  |  Tag version: $TAG_VERSION"
          if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: androidApp versionName ($GRADLE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Android version check passed"

      - name: Check Desktop packageVersion in composeApp/build.gradle.kts
        run: |
          DESKTOP_VERSION=$(grep 'packageVersion' composeApp/build.gradle.kts | sed 's/.*packageVersion = "\([^"]*\)".*/\1/')
          TAG_VERSION=${{ steps.tag_version.outputs.tag_version }}
          DESKTOP_BASE=$(echo "$DESKTOP_VERSION" | cut -d. -f1-2)
          echo "Desktop packageVersion: $DESKTOP_VERSION  |  Tag version: $TAG_VERSION"
          if [ "$DESKTOP_BASE" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: composeApp packageVersion ($DESKTOP_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Desktop version check passed"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Build App Bundle
        run: ./gradlew :androidApp:bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: androidApp/build/outputs/bundle/release/

  build-desktop-linux:
    name: Build Desktop (Linux .deb)
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build DEB package
        run: ./gradlew :composeApp:packageDeb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: composeApp/build/compose/binaries/main/deb/

  build-desktop-windows:
    name: Build Desktop (Windows .msi)
    runs-on: windows-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build MSI package
        run: ./gradlew :composeApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msi
          path: composeApp/build/compose/binaries/main/msi/

  build-desktop-macos:
    name: Build Desktop (macOS .dmg)
    runs-on: macos-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build DMG package
        run: ./gradlew :composeApp:packageDmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-desktop-linux, build-desktop-windows, build-desktop-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

