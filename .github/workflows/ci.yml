name: CI

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      number: ${{ steps.version.outputs.number }}
      code: ${{ steps.version.outputs.code }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          COMMIT_MSG="$(git log -1 --format='%s')"

          if echo "$COMMIT_MSG" | grep -qiF "(major)"; then
            BUMP=major
          elif echo "$COMMIT_MSG" | grep -qiF "(minor)"; then
            BUMP=minor
          elif echo "$COMMIT_MSG" | grep -qiF "(patch)"; then
            BUMP=patch
          else
            BUMP=none
          fi

          LATEST="$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)"
          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NUMBER="${MAJOR}.${MINOR}.${PATCH}"
          if [ "$BUMP" = "none" ]; then
            VERSION="$(git rev-parse --short=8 HEAD)"
          else
            VERSION="v${NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION ($NUMBER)"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:jvmTest

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ "${{ needs.version.outputs.bump }}" != none ] && VERSION_ARG=-PappVersion=${{ needs.version.outputs.number }}
          ./gradlew :androidApp:assembleRelease $VERSION_ARG -PappVersionCode=${{ needs.version.outputs.code }}
          mkdir -p dist
          APK="$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)"
          cp "$APK" dist/turnable-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: turnable-android
          path: dist/

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest,  task: packageDeb, ext: deb }
          - { name: windows, os: windows-latest, task: packageMsi, ext: msi }
          - { name: macos,   os: macos-latest,   task: packageDmg, ext: dmg }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        shell: bash
        run: |
          [ "${{ needs.version.outputs.bump }}" != none ] && VERSION_ARG=-PappVersion=${{ needs.version.outputs.number }}
          ./gradlew :composeApp:${{ matrix.task }} $VERSION_ARG
          mkdir -p dist
          cp "$(find composeApp/build/compose/binaries -name '*.${{ matrix.ext }}' | head -n1)" "dist/turnable-${{ matrix.name }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: turnable-desktop-${{ matrix.name }}
          path: dist/

  release:
    name: Release
    needs: [version, test, android, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "Turnable App ${{ needs.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
